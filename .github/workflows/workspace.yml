name: Workspace source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/gameplay/*.test.mjs
      - run: python3 -m unittest discover -s tools/gameplay -p 'test_*.py'
      - run: python3 -m unittest discover -s tests/workspace
      - run: python3 scripts/workspace.py check --metadata-only
      - run: python3 scripts/workspace.py init
      - run: python3 scripts/workspace.py check
  telemetry:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git submodule update --init components/dxmt
      - run: python3 tools/telemetry/check.py
      - run: python3 -m unittest discover -s tools/gameplay -p 'test_*.py'
  backports:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git submodule update --init components/wine components/dxmt
      - run: python3 components/wine/vibewine/verify_source.py
      - run: python3 components/wine/vibewine/tests/thread-exit/run.py --sanitize --repetitions 2
      - run: python3 components/wine/vibewine/tests/backports.py
      - run: python3 components/wine/vibewine/tests/msync-alert-ownership/run.py --sanitize
      - run: python3 components/wine/vibewine/tests/msync-alert-ownership/run.py --revision 112937399b7bc2b53881a3f10db500786ca7b034 --expect-regression --sanitize
      - run: python3 components/wine/vibewine/tests/msync-memory-ownership/run_table.py --sanitize
      - run: python3 components/wine/vibewine/tests/msync-memory-ownership/run_table.py --revision 112937399b7bc2b53881a3f10db500786ca7b034 --expect-regression --sanitize
      - run: python3 components/wine/vibewine/tests/msync-deadline/run.py --sanitize
      - run: python3 components/wine/vibewine/tests/msync-deadline/run.py --revision 506004b729856034a7d280f0ab505a8b3cfe54d6 --expect-regression --sanitize
      - run: python3 components/wine/vibewine/tests/msync-freehint/run.py --sanitize
      - run: python3 components/wine/vibewine/tests/msync-freehint/run.py --revision 506004b729856034a7d280f0ab505a8b3cfe54d6 --expect-regression --sanitize
      - run: python3 components/wine/vibewine/tests/native-cursor-focus/run.py
      - run: python3 components/wine/vibewine/tests/msync_registration.py --source-dir components/wine
      - run: python3 components/wine/vibewine/tests/address-wait/run.py --sanitize
      - run: python3 components/wine/vibewine/tests/address-wait/run.py --revision d2237a9a82d9960360ce8400242ddeae6646c347 --expect-regression --sanitize
      - run: python3 components/wine/vibewine/tests/address-wait/run_publication.py --sanitize

name: Workspace source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/gameplay/*.test.mjs
      - run: python3 -m unittest discover -s tools/gameplay -p 'test_*.py'
      - run: python3 -m unittest discover -s tests/workspace
      - run: python3 scripts/workspace.py check --metadata-only
      - run: python3 scripts/workspace.py init
      - run: python3 scripts/workspace.py check
  telemetry:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git submodule update --init components/dxmt
      - run: python3 tools/telemetry/check.py
      - run: python3 -m unittest discover -s tools/gameplay -p 'test_*.py'
  backports:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git submodule update --init components/wine components/dxmt
      - run: python3 components/wine/vibewine/verify_source.py
      - run: python3 components/wine/vibewine/tests/thread-exit/run.py --sanitize --repetitions 2
      - run: python3 components/wine/vibewine/tests/backports.py
      - run: python3 components/wine/vibewine/tests/msync_registration.py --source-dir components/wine
      - run: python3 components/wine/vibewine/tests/address-wait/run.py --sanitize
      - run: python3 components/wine/vibewine/tests/address-wait/run.py --revision d2237a9a82d9960360ce8400242ddeae6646c347 --expect-regression --sanitize
      - run: python3 components/wine/vibewine/tests/address-wait/run_publication.py --sanitize
      - run: python3 components/wine/vibewine/tests/address-wait/run_publication.py --revision 85864be47d483d4518f729baef48cbf52ea1e5cf --expect-regression --sanitize
      - run: python3 components/wine/vibewine/tests/vulkan-portability/run.py
      - run: python3 components/wine/vibewine/tests/vulkan-portability/run.py --revision d2237a9a82d9960360ce8400242ddeae6646c347 --expect-regression
      - run: python3 tests/vibewine/compile_regressions.py
        working-directory: components/dxmt
      - run: python3 tests/vibewine/chromaticity-lifetime/run.py
        working-directory: components/dxmt
      - run: python3 tests/vibewine/chromaticity-lifetime/run.py --baseline-ref bbf22e6a41b383fe67be9dbba80c9f682908c01a
        working-directory: components/dxmt
      - run: python3 tests/vibewine/context-locks/run.py --sanitize
        working-directory: components/dxmt
      - run: python3 tests/vibewine/context-locks/run.py --source-ref e7b02196a31dc633ac802c9c27b88dbdd8f40dca --expect-unlocked-baseline --sanitize
        working-directory: components/dxmt
      - run: python3 tests/vibewine/failed-pipeline/run.py
        working-directory: components/dxmt
      - run: python3 tests/vibewine/failed-pipeline/run.py --source-ref 25eff5e13003d5e7f6b7cf6e1c76e9e6f3363e27 --expect-baseline-failure
        working-directory: components/dxmt
      - run: python3 tests/vibewine/failed-pipeline/run.py --mutation unguarded
        working-directory: components/dxmt
      - run: python3 tests/vibewine/failed-pipeline/run.py --mutation sticky
        working-directory: components/dxmt
      - run: python3 tests/vibewine/failed-pipeline/run.py --mutation early-stage
        working-directory: components/dxmt
      - run: python3 tests/vibewine/demand-scheduler/run.py
        working-directory: components/dxmt
      - run: python3 tests/vibewine/discard-hints/run.py
        working-directory: components/dxmt
      - run: python3 tests/vibewine/device-teardown/run.py
        working-directory: components/dxmt
      - run: python3 tests/vibewine/encoder-marshalling/test_present.py

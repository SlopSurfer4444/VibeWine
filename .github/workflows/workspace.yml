name: Workspace source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/gameplay/session.test.mjs
      - run: python3 -m unittest discover -s tests/workspace
      - run: python3 scripts/workspace.py check --metadata-only
      - run: python3 scripts/workspace.py init
      - run: python3 scripts/workspace.py check
  telemetry:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git submodule update --init components/dxmt
      - run: python3 tools/telemetry/check.py
  backports:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git submodule update --init components/wine components/dxmt
      - run: python3 components/wine/vibewine/verify_source.py
      - run: python3 components/wine/vibewine/tests/backports.py
      - run: python3 components/wine/vibewine/tests/msync_registration.py --source-dir components/wine
      - run: python3 components/wine/vibewine/tests/address-wait/run.py --sanitize
      - run: python3 components/wine/vibewine/tests/address-wait/run.py --revision d2237a9a82d9960360ce8400242ddeae6646c347 --expect-regression --sanitize
      - run: python3 components/wine/vibewine/tests/vulkan-portability/run.py
      - run: python3 components/wine/vibewine/tests/vulkan-portability/run.py --revision d2237a9a82d9960360ce8400242ddeae6646c347 --expect-regression
      - run: python3 tests/vibewine/compile_regressions.py
        working-directory: components/dxmt
      - run: python3 tests/vibewine/context-locks/run.py --sanitize
        working-directory: components/dxmt
      - run: python3 tests/vibewine/context-locks/run.py --source-ref e7b02196a31dc633ac802c9c27b88dbdd8f40dca --expect-unlocked-baseline --sanitize
        working-directory: components/dxmt
